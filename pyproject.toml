[project]
name = "nights-service"
version = "0.2.0"
description = "A GraphQL service to store nights data"
authors = [{ name = "behlock" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.136.0,<0.137.0)",
    "uvicorn[standard] (>=0.47.0,<0.48.0)",
    "starlette-graphene3 (>=0.6.0,<0.7.0)",
    "graphene (>=3.4.3,<4.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pydantic (>=2.13.0,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "python-dotenv (>=1.2.0,<2.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "requests (>=2.34.0,<3.0.0)",
    "python-dateutil (>=2.9.0,<3.0.0)",
    "typer (>=0.25.0,<1.0.0)",
]

[tool.poetry]
packages = [
    { include = "nightsservice", from = "src" },
    { include = "nightsretrieval", from = "src" },
    { include = "database", from = "src" },
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.0"
mypy = "^2.1.0"
pytest = "^9.0.0"
types-requests = "*"
types-python-dateutil = "*"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ---- Ruff (replaces black, flake8, isort, pep8-naming, vulture) ----
[tool.ruff]
line-length = 99
target-version = "py313"
extend-exclude = [".venv", "src/database/nightsretrieval.db"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "S101", # asserts allowed
    "B008", # function call as default arg (Typer/FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

# ---- mypy ----
[tool.mypy]
python_version = "3.13"
mypy_path = "stubs"
namespace_packages = true
follow_imports = "normal"
warn_unused_configs = true
ignore_missing_imports = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_incomplete_stub = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_context = true
strict_equality = true
strict_optional = true
strict = true
pretty = true

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
